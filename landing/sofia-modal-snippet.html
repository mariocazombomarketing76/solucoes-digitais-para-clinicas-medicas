<!--
  ============================================================
  SNIPPET SOFIA 24/7 — Modal lado a lado (chat + painel)
  ============================================================
  COMO USAR:
  1. Cola este bloco inteiro no final do <body> da tua landing page
     (mesmo antes de </body>).
  2. Qualquer botão/link cujo texto seja "Testar Secretária 24/7"
     abrira automaticamente o modal ao ser clicado.
     (Funciona com <button>, <a>, ou qualquer elemento clicavel.)
  3. Nao precisas de configurar mais nada — as URLs ja estao preenchidas.
  ============================================================
-->

<!-- ===================== ESTILOS ===================== -->
<style>
  #sofia-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #sofia-overlay.sofia-open { display: flex; }

  #sofia-modal {
    background: #f4f6fb;
    width: min(960px, 95vw);
    height: min(640px, 90vh);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  #sofia-header {
    background: #0b5ed7;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sofia-header h3 { margin: 0; font-size: 17px; font-weight: 600; }
  #sofia-header small { opacity: 0.85; font-weight: 400; }
  #sofia-close {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }
  #sofia-close:hover { background: rgba(255, 255, 255, 0.35); }

  #sofia-body {
    flex: 1;
    display: flex;
    gap: 12px;
    padding: 12px;
    min-height: 0;
  }

  /* Coluna do chat */
  #sofia-chat-col {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    min-height: 0;
  }
  #sofia-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sofia-msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .sofia-msg.bot { background: #eef2ff; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
  .sofia-msg.user { background: #0b5ed7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .sofia-msg.typing { background: #eef2ff; color: #64748b; align-self: flex-start; font-style: italic; }

  #sofia-input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
  }
  #sofia-input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  #sofia-input:focus { border-color: #0b5ed7; }
  #sofia-send {
    background: #0b5ed7;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sofia-send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Coluna do painel */
  #sofia-panel-col {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    overflow-y: auto;
    min-height: 0;
  }
  #sofia-panel-col h4 {
    margin: 0 0 14px;
    font-size: 15px;
    color: #0b5ed7;
    border-bottom: 2px solid #eef2ff;
    padding-bottom: 8px;
  }
  .sofia-field { margin-bottom: 12px; }
  .sofia-field .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    display: block;
    margin-bottom: 2px;
  }
  .sofia-field .value {
    font-size: 14px;
    color: #1e293b;
    font-weight: 500;
    min-height: 18px;
  }
  .sofia-field .value.empty { color: #cbd5e1; font-weight: 400; font-style: italic; }

  @media (max-width: 680px) {
    #sofia-body { flex-direction: column; }
    #sofia-modal { height: 92vh; }
  }
</style>

<!-- ===================== MARKUP DO MODAL ===================== -->
<div id="sofia-overlay">
  <div id="sofia-modal">
    <div id="sofia-header">
      <h3>Sofia — Secretária Digital 24/7 <small>| Clínica Vida+</small></h3>
      <button id="sofia-close" aria-label="Fechar">&times;</button>
    </div>
    <div id="sofia-body">
      <!-- Chat -->
      <div id="sofia-chat-col">
        <div id="sofia-messages"></div>
        <div id="sofia-input-row">
          <input id="sofia-input" type="text" placeholder="Escreva a sua mensagem..." autocomplete="off" />
          <button id="sofia-send">Enviar</button>
        </div>
      </div>
      <!-- Painel -->
      <div id="sofia-panel-col">
        <h4>📋 Ficha do Cliente (ao vivo)</h4>
        <div class="sofia-field"><span class="label">Nome</span><span class="value empty" data-f="patient_name">—</span></div>
        <div class="sofia-field"><span class="label">Telefone</span><span class="value empty" data-f="phone">—</span></div>
        <div class="sofia-field"><span class="label">Email</span><span class="value empty" data-f="email">—</span></div>
        <div class="sofia-field"><span class="label">Especialidade</span><span class="value empty" data-f="specialty">—</span></div>
        <div class="sofia-field"><span class="label">Médico</span><span class="value empty" data-f="doctor">—</span></div>
        <div class="sofia-field"><span class="label">Horário</span><span class="value empty" data-f="appointment_slot">—</span></div>
        <div class="sofia-field"><span class="label">Tipo de Lead</span><span class="value empty" data-f="lead_type">—</span></div>
        <div class="sofia-field"><span class="label">Notas</span><span class="value empty" data-f="notes">—</span></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== LÓGICA ===================== -->
<script>
(function () {
  // ---- CONFIGURAÇÃO (URLs do teu workflow n8n) ----
  var URL_CHAT  = "https://edson76.app.n8n.cloud/webhook/1b7bb92e-8e17-4762-bc59-9ac160e977e8/chat";
  var URL_FICHA = "https://edson76.app.n8n.cloud/webhook/clinica-demo-ficha";
  var TEXTO_BOTAO = "testar secretária 24/7"; // comparação sem maiúsculas/acentos-sensível

  // ---- Estado ----
  var sessionId = null;
  var pollTimer = null;

  // ---- Elementos ----
  var overlay  = document.getElementById("sofia-overlay");
  var closeBtn = document.getElementById("sofia-close");
  var messages = document.getElementById("sofia-messages");
  var input    = document.getElementById("sofia-input");
  var sendBtn  = document.getElementById("sofia-send");

  // ---- Abrir o modal a partir de QUALQUER botão "Testar Secretária 24/7" ----
  document.addEventListener("click", function (e) {
    var el = e.target;
    // sobe ate 3 níveis para apanhar <a><span>texto</span></a> etc.
    for (var i = 0; i < 3 && el; i++) {
      var txt = (el.textContent || "").trim().toLowerCase();
      if (txt === TEXTO_BOTAO) {
        e.preventDefault();
        abrirModal();
        return;
      }
      el = el.parentElement;
    }
  });

  function abrirModal() {
    overlay.classList.add("sofia-open");
    if (!sessionId) {
      sessionId = "sofia-" + Date.now() + "-" + Math.floor(Math.random() * 100000);
      addMsg("bot", "Olá! 👋 Sou a Sofia, secretária digital da Clínica Vida+. Como posso ajudar hoje?");
    }
    input.focus();
    iniciarPolling();
  }

  function fecharModal() {
    overlay.classList.remove("sofia-open");
    pararPolling();
  }

  closeBtn.addEventListener("click", fecharModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) fecharModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") fecharModal(); });

  // ---- Enviar mensagem ----
  function enviar() {
    var texto = input.value.trim();
    if (!texto) return;
    addMsg("user", texto);
    input.value = "";
    sendBtn.disabled = true;

    var typing = addMsg("typing", "Sofia está a escrever...");

    fetch(URL_CHAT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "sendMessage", chatInput: texto, sessionId: sessionId })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        typing.remove();
        var resposta = data.output || data.text || data.response || "(sem resposta)";
        addMsg("bot", resposta);
        atualizarFicha(); // atualiza o painel logo após a resposta
      })
      .catch(function () {
        typing.remove();
        addMsg("bot", "⚠️ Ocorreu um erro de ligação. Tente novamente dentro de alguns segundos.");
      })
      .finally(function () {
        sendBtn.disabled = false;
        input.focus();
      });
  }

  sendBtn.addEventListener("click", enviar);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") enviar(); });

  function addMsg(tipo, texto) {
    var div = document.createElement("div");
    div.className = "sofia-msg " + tipo;
    div.textContent = texto;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  // ---- Painel (ficha ao vivo) ----
  function iniciarPolling() {
    pararPolling();
    pollTimer = setInterval(atualizarFicha, 4000);
  }
  function pararPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function atualizarFicha() {
    if (!sessionId) return;
    fetch(URL_FICHA + "?session_id=" + encodeURIComponent(sessionId))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        // A resposta pode vir como objeto, array, ou {data:[...]}. Normalizamos.
        var ficha = data;
        if (Array.isArray(data)) ficha = data[data.length - 1];
        else if (data && Array.isArray(data.data)) ficha = data.data[data.data.length - 1];
        if (!ficha) return;
        document.querySelectorAll("#sofia-panel-col .value").forEach(function (span) {
          var campo = span.getAttribute("data-f");
          var val = ficha[campo];
          if (val && String(val).trim()) {
            span.textContent = val;
            span.classList.remove("empty");
          }
        });
      })
      .catch(function () { /* silencioso — ficha ainda pode não existir */ });
  }
})();
</script>
